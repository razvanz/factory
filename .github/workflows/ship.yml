name: ship

# Fixed stage graph for one groomed GitHub issue. The issue is the unit of work: its
# body holds the spec, and the summary job records the stage results on it. Every stage runs in order and records a
# result. Only the stage itself may decide to skip, and it must say why. A failed or
# blocked stage stops the later stages, and the summary job reports them as missing.
# Milestone 1: every stage is a stub that proves the wiring.

on:
  workflow_call:
    inputs:
      issue_number:
        description: The groomed issue in the caller repo
        type: number
        required: true
      factory_ref:
        description: Ref of razvanz/factory that the stages load scripts and skills from. Keep it equal to the ref in the caller's uses line.
        type: string
        default: main
    secrets:
      claude_code_oauth_token:
        required: false

concurrency:
  group: ship-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  FACTORY: .factory-src

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          if ! issue=$(gh issue view "${ISSUE}" --json state,body,labels 2>&1); then
            "$FACTORY/bin/stage-result" preflight blocked "issue #${ISSUE} not readable"
          elif [[ $(jq -r .state <<<"${issue}") != OPEN ]]; then
            "$FACTORY/bin/stage-result" preflight blocked "issue #${ISSUE} is not open"
          elif ! jq -r .body <<<"${issue}" | grep -qiE '^#+ *acceptance criteria'; then
            "$FACTORY/bin/stage-result" preflight blocked "issue #${ISSUE} has no Acceptance criteria section"
          else
            "$FACTORY/bin/stage-result" preflight done "" "issue #${ISSUE} is open and groomed"
          fi

  tdd:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" tdd skipped "stub: milestone 1"'

  quality:
    needs: tdd
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" quality skipped "stub: milestone 1"'

  pr:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" pr skipped "stub: milestone 1"'

  qa:
    needs: pr
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" qa skipped "prototype has no deploy target"'

  notify:
    needs: qa
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" notify skipped "stub: milestone 1"'

  monitor:
    needs: notify
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" monitor skipped "prototype has no deploy target"'

  retro:
    needs: monitor
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: r
        run: '"$FACTORY/bin/stage-result" retro skipped "stub: milestone 1"'

  summary:
    if: always()
    needs: [preflight, tdd, quality, pr, qa, notify, monitor, retro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: razvanz/factory, ref: "${{ inputs.factory_ref }}", path: .factory-src, sparse-checkout: bin }
      - id: s
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPORT_FILE: report.md
        run: '"$FACTORY/bin/summarize" "$NEEDS" preflight tdd quality pr qa notify monitor retro'
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.s.outcome }}
        run: '"$FACTORY/bin/report-to-issue" "${ISSUE}" "${OUTCOME}" "${RUN_URL}" report.md'
